<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>LinkedIn OG Image — 1200×630</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #A21D54;
    }
    .card {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #A21D54 0%, #7c1640 55%, #1e293b 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Decorative circles */
    .circle1 {
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
      top: -150px; right: -100px;
    }
    .circle2 {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
      bottom: -120px; left: 60px;
    }
    .circle3 {
      position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.08);
      top: 80px; right: 280px;
    }
    /* Dot grid */
    .dots {
      position: absolute;
      top: 0; right: 0;
      width: 380px; height: 300px;
      background-image: radial-gradient(circle, rgba(255,255,255,0.12) 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      opacity: 0.5;
    }
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 80px;
      padding: 0 90px;
      width: 100%;
    }
    .logo-wrap {
      flex-shrink: 0;
      width: 140px; height: 140px;
      background: rgba(255,255,255,0.12);
      border-radius: 32px;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
    }
    .right {
      flex: 1;
    }
    .eyebrow {
      font-size: 18px;
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .title {
      font-size: 74px;
      font-weight: 800;
      color: white;
      line-height: 1;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
    }
    .title span {
      color: rgba(255,255,255,0.45);
    }
    .tagline {
      font-size: 26px;
      font-weight: 600;
      color: rgba(255,255,255,0.75);
      margin-bottom: 36px;
      line-height: 1.4;
    }
    .pills {
      display: flex;
      gap: 14px;
    }
    .pill {
      padding: 8px 20px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: white;
      font-size: 16px;
      font-weight: 600;
    }
    .url {
      position: absolute;
      bottom: 36px;
      right: 90px;
      font-size: 18px;
      font-weight: 700;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.04em;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="circle1"></div>
    <div class="circle2"></div>
    <div class="circle3"></div>
    <div class="dots"></div>

    <div class="content">
      <!-- Logo icon -->
      <div class="logo-wrap">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none">
          <polygon points="12,3 22,8 12,13 2,8" fill="white"/>
          <path d="M6 10.5v4c0 1.66 2.46 3 6 3s6-1.34 6-3v-4" stroke="white" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
          <line x1="20" y1="8" x2="20" y2="14.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="20" cy="15.8" r="1.5" fill="white"/>
        </svg>
      </div>

      <div class="right">
        <p class="eyebrow">Ireland's Student Job Platform</p>
        <h1 class="title">Student<span>Shifts</span></h1>
        <p class="tagline">Find flexible part-time work<br>that fits your college timetable.</p>
        <div class="pills">
          <span class="pill">✓ Verified Employers</span>
          <span class="pill">✓ Free to Join</span>
          <span class="pill">✓ Apply in Minutes</span>
        </div>
      </div>
    </div>

    <p class="url">studentshifts.ie</p>
  </div>
</body>
</html>
