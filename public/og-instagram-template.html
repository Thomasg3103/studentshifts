<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <title>Instagram Image — 1080×1080</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .card {
      width: 1080px;
      height: 1080px;
      background: linear-gradient(150deg, #A21D54 0%, #7c1640 45%, #1e293b 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      gap: 0;
    }
    /* Decorative circles */
    .circle1 {
      position: absolute;
      width: 800px; height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.07) 0%, transparent 65%);
      top: -250px; right: -200px;
    }
    .circle2 {
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 65%);
      bottom: -200px; left: -100px;
    }
    .ring1 {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.07);
      top: 100px; left: -100px;
    }
    .ring2 {
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.07);
      bottom: 120px; right: 80px;
    }
    /* Dot grid top right */
    .dots {
      position: absolute;
      top: 40px; right: 40px;
      width: 260px; height: 260px;
      background-image: radial-gradient(circle, rgba(255,255,255,0.15) 2px, transparent 2px);
      background-size: 32px 32px;
      opacity: 0.4;
    }
    /* Dot grid bottom left */
    .dots2 {
      position: absolute;
      bottom: 60px; left: 40px;
      width: 200px; height: 200px;
      background-image: radial-gradient(circle, rgba(255,255,255,0.1) 2px, transparent 2px);
      background-size: 28px 28px;
      opacity: 0.35;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 80px;
    }
    .logo-wrap {
      width: 160px; height: 160px;
      background: rgba(255,255,255,0.12);
      border-radius: 40px;
      display: flex; align-items: center; justify-content: center;
      border: 2.5px solid rgba(255,255,255,0.22);
      margin-bottom: 52px;
    }
    .eyebrow {
      font-size: 20px;
      font-weight: 700;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .title {
      font-size: 96px;
      font-weight: 800;
      color: white;
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin-bottom: 28px;
    }
    .title .muted {
      color: rgba(255,255,255,0.42);
    }
    .tagline {
      font-size: 28px;
      font-weight: 600;
      color: rgba(255,255,255,0.72);
      line-height: 1.45;
      margin-bottom: 60px;
      max-width: 700px;
    }
    .pills {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      margin-bottom: 60px;
    }
    .pill-row {
      display: flex;
      gap: 16px;
    }
    .pill {
      padding: 12px 28px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.22);
      color: white;
      font-size: 18px;
      font-weight: 600;
    }
    .url {
      font-size: 22px;
      font-weight: 700;
      color: rgba(255,255,255,0.42);
      letter-spacing: 0.06em;
      position: absolute;
      bottom: 52px;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="circle1"></div>
    <div class="circle2"></div>
    <div class="ring1"></div>
    <div class="ring2"></div>
    <div class="dots"></div>
    <div class="dots2"></div>

    <div class="content">
      <div class="logo-wrap">
        <svg width="90" height="90" viewBox="0 0 24 24" fill="none">
          <polygon points="12,3 22,8 12,13 2,8" fill="white"/>
          <path d="M6 10.5v4c0 1.66 2.46 3 6 3s6-1.34 6-3v-4" stroke="white" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
          <line x1="20" y1="8" x2="20" y2="14.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="20" cy="15.8" r="1.5" fill="white"/>
        </svg>
      </div>

      <p class="eyebrow">Ireland's Student Job Platform</p>
      <h1 class="title">Student<br><span class="muted">Shifts</span></h1>
      <p class="tagline">Flexible part-time jobs for Irish students.<br>Verified employers. Apply in minutes.</p>

      <div class="pills">
        <div class="pill-row">
          <span class="pill">✓ Free to Join</span>
          <span class="pill">✓ Verified Employers</span>
        </div>
        <div class="pill-row">
          <span class="pill">✓ Apply in Minutes</span>
        </div>
      </div>
    </div>

    <p class="url">studentshifts.ie</p>
  </div>
</body>
</html>
